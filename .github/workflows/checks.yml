name: checks
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "site/**", "paper/**", "*.md"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.5.4 pytest
      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ hashFiles('prepare.py') }}
      - run: python prepare.py
      - run: sudo apt-get install -y bubblewrap
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: python -m pytest tests -q --durations=8
  calibrate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy==2.5.4
      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ hashFiles('prepare.py') }}
      - run: python prepare.py
      # It exits nonzero on x86, where 4 of 335 rows miss 5x. Prices are frozen, so the misses are stated in the README and not fixed here.
      - run: python tools/calibrate.py --json calibrate-x86.json
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calibrate-x86
          path: calibrate-x86.json
